<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
let portfolioLightbox;

function initPortfolioLightbox() {
    if (!window.GLightbox) {
        return;
    }

    if (portfolioLightbox && typeof portfolioLightbox.destroy === 'function') {
        portfolioLightbox.destroy();
    }

    portfolioLightbox = GLightbox({
        selector: '.gallery .glightbox:not(.is-hidden)',
        touchNavigation: true,
        loop: true
    });
}

initPortfolioLightbox();

document.querySelectorAll('.portfolio-filter-button').forEach((button) => {
    button.addEventListener('click', () => {
        const filter = button.dataset.filter;

        document.querySelectorAll('.portfolio-filter-button').forEach((filterButton) => {
            const isActive = filterButton === button;
            filterButton.classList.toggle('is-active', isActive);
            filterButton.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });

        document.querySelectorAll('.gallery .glightbox').forEach((item) => {
            const categories = (item.dataset.categories || '').split(' ');
            const shouldShow = filter === 'all' || categories.includes(filter);
            item.classList.toggle('is-hidden', !shouldShow);
        });

        initPortfolioLightbox();
    });
});
</script>
